[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoflow"
version = "0.4.0"
description = "A numerical laboratory for rotating shallow water"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]
earth = ["xarray>=2024.6", "netCDF4>=1.7"]
neural = ["torch>=2.6"]
ui = ["streamlit>=1.40"]

[project.scripts]
geoflow = "geoflow.cli:main"
geoflow-neural = "geoflow.neural.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
